# XcodeGen spec that wraps the SPM `Sources/Downbar` target as a proper macOS
# .app, so it can be archived and uploaded to App Store Connect (SPM
# executables cannot). Regenerate the project after any edit here with:
#   xcodegen generate
#
# See RELEASE.md for the full release walkthrough.
name: Downbar
options:
  bundleIdPrefix: com.nathantarasiuk
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.nathantarasiuk.downbar
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_ENTITLEMENTS: Resources/Downbar.entitlements
    CODE_SIGN_STYLE: Automatic
    # Individual enrollment, Apple ID ntarasiuk@gmail.com. Pinned so the
    # generated project archives without setting the Team in Xcode by hand.
    DEVELOPMENT_TEAM: CZ9PBCRGWY

targets:
  Downbar:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Downbar
      # AppIcon.icns is referenced via the Info.plist CFBundleIconFile and
      # copied into the bundle (no asset catalog needed for a single .icns).
      # Declared as a source with an explicit resources build phase — a target
      # `resources:` key is silently ignored by XcodeGen here.
      - path: Resources/AppIcon.icns
        buildPhase: resources
    # XcodeGen rewrites the file it's pointed at, so it gets a dedicated copy
    # (Info-Xcode.plist) rather than clobbering Resources/Info.plist, which
    # scripts/build-app.sh copies verbatim into the SPM-built bundle.
    info:
      path: Resources/Info-Xcode.plist
      # GENERATE_INFOPLIST_FILE is NO, so INFOPLIST_KEY_* build settings are
      # ignored — the agent-app flag and icon reference must live in the plist
      # itself. These mirror Resources/Info.plist (the build-app.sh bundle).
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleIconFile: AppIcon
        CFBundleDisplayName: Downbar
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
