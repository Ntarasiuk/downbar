# Cloudflare Pages config for the downbar.app landing site.
# Static site (no build step); served from site/. Deploys on push to master
# via the Pages Git integration. The launch waitlist + its D1 binding were
# removed once Downbar shipped on the App Store (2026-06-25); historical
# signups remain in the downbar-waitlist D1 database.
name = "downbar"
compatibility_date = "2026-06-18"
pages_build_output_dir = "site"
